<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summit Fund · CSU College of Business</title>
  <meta name="description" content="Summit Fund: Colorado State University's student-run investment fund since 1999.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="/files/theme/sf-config.js?v=mock21"></script>
  <script src="/files/theme/sf-site.js?v=mock21"></script>
  <!-- the words on every page live in content.js -->
  <script src="/files/theme/sf-content.js?v=mock21"></script>
</head>
<body>
  <!-- our styles load after the ones Weebly adds to <head>, so ours win -->
  <link rel="stylesheet" href="/files/theme/sf-base.css?v=mock21">
  <link rel="stylesheet" href="/files/theme/sf-pages.css?v=mock21">
  <link rel="stylesheet" href="/files/theme/sf-drawer.css?v=mock21">
  <link rel="stylesheet" href="/files/theme/sf-sections.css?v=mock21">
  <link rel="stylesheet" href="/files/theme/sf-weebly.css">
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero container">
      <p class="eyebrow reveal"><span data-site="tagline"></span></p>
      <h1 class="reveal" style="--d:.05s"><span data-site="name"></span></h1>
      <p class="lead reveal" style="--d:.1s" id="hero-lead"></p>
      <div class="cta-row reveal" style="--d:.15s" id="hero-cta"></div>
    </section>

    <div class="sheet">
      <section class="container">
        <div class="facts reveal" id="facts"></div>
      </section>
      <div id="sections"></div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
  <script src="/files/theme/sf-sections.js?v=mock21" data-page="overview"></script>
  <div id="wsite-hidden" aria-hidden="true">{content}</div>
</body>
</html>
